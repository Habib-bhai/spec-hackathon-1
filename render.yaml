services:
  - type: web
    name: physical-ai-textbook-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: textbook_chunks
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: $PORT
      - key: API_RELOAD
        value: false
      - key: API_WORKERS
        value: 1
      - key: CORS_ORIGINS
        value: https://yourdomain.github.io,https://your-frontend-url.onrender.com
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: true
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO